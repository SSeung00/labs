[project]
name = "englishlab-backend"
version = "0.1.0"
description = "EnglishLab local API: AI tutor, adaptive reading, FSRS vocabulary, voice conversation"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "edge-tts>=7.3.1",
    "fastapi>=0.146.0",
    "faster-whisper>=1.2.1",
    "fsrs>=6.3.2",
    "httpx>=0.28.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "segno>=1.6.6",
    "simplemma>=2.0.0",
    "sqlmodel>=0.0.48",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
    "wordfreq>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# FastAPI's File()/Form() defaults are the documented pattern; local naive datetimes are intentional.
ignore = ["E501", "B008"]
