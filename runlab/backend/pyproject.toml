[project]
name = "runlab-backend"
version = "0.1.0"
description = "RunLab local API: Garmin ingest, analytics, planner"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.0",
    "duckdb>=1.5.6",
    "fastapi>=0.142.2",
    "fitdecode>=0.11.0",
    "garminconnect>=0.3.17",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "segno>=1.6.6",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fit-tool>=0.9.16",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Local single-user app: naive local datetimes are intentional, and background
# jobs deliberately catch broad exceptions to report them in the UI.
ignore = ["BLE001", "DTZ001", "DTZ005", "DTZ007", "DTZ011"]
