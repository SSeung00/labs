[project]
name = "routinelab-backend"
version = "0.1.0"
description = "RoutineLab local API: daily routines, habit tracking, reflection journal, push reminders"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "python-dotenv>=1.2.4",
    "pywebpush>=2.5.0",
    "segno>=1.6.6",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# FastAPI's Depends()/Query() defaults are the documented pattern; local naive datetimes are intentional.
ignore = ["E501", "B008"]
