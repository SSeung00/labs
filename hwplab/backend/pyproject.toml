[project]
name = "hwplab-backend"
version = "0.1.0"
description = "HwpLab local API: open HWP 5.0 / HWPX, edit, save as HWPX"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "lxml>=6.1.3",
    "olefile>=0.47",
    "pillow>=12.3.0",
    "python-hwpx>=6.8.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
